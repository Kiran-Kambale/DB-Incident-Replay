
services:
  db:
    image: postgres:17
    container_name: pii-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: incident_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incident_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - pii-network

  app:
    image: kirankambale/kiran_db_replay_app:latest
    container_name: pii-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: incident_lab
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/incident_lab

    ports:
      - "8000:8000"

    volumes:
      - incident_data:/app/data

    depends_on:
      db:
        condition: service_healthy

    networks:
      - pii-network

volumes:
  postgres_data:
  incident_data:

networks:
  pii-network:
    driver: bridge
