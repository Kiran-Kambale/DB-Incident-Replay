services:
  db:
    image: postgres:17
    container_name: pii-postgres
    restart: unless-stopped


    environment:
      POSTGRES_DB: incident_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChangeThisPassword123!

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incident_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: kirankambale/kiran_db_replay_app:latest
    container_name: pii-app
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:ChangeThisPassword123!@db:5432/incident_lab

    ports:
      - "8000:8000"

    volumes:
      - incident_data:/app/data

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  incident_data:
